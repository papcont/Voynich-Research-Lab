sources:
  zl3b:
    role: primary_transcription
    transcription: Zandbergen-Landini ZL3b
    format: IVTFF Eva- 2.0
    version_date: 2025-05-13
    url: https://raw.githubusercontent.com/matthewdgreen/cipher_benchmark/main/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
    upstream_repository: matthewdgreen/cipher_benchmark
    upstream_path: benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
    upstream_git_blob_sha1: 2a4533ab9bdfa85db9bad602d590978953055df1
    local_path: data/raw/ZL3b-n.txt
    redistribution: do_not_commit_by_default
  it2a:
    role: secondary_transliteration_for_gate_v2_robustness
    transcription: Takahashi IT (IVTFF release 2a, voynich.nu)
    format: IVTFF Eva- 2.0
    url: https://www.voynich.nu/data/IT_ivtff_2a.txt
    sha256: UNVERIFIED_FETCH_BLOCKED_2026-10-19   # record on first successful fetch; Gate v2 refuses unregistered hashes
    local_path: data/raw/IT_ivtff_2a.txt
    redistribution: do_not_commit_by_default
    note: voynich.nu was unreachable from the 2026-10-19 cloud environment (connection failure); not present in matthewdgreen/cipher_benchmark (checked 2026-10-19, ZL3b only).
  gc:
    role: optional_transliteration_for_gate_v2_robustness
    transcription: Glen Claston v101 as IVTFF (voynich.nu, GC release 0d)
    format: IVTFF v101 alphabet (not EVA; alignment by locus only)
    url: https://www.voynich.nu/data/GC_ivtff_0d.txt
    sha256: UNVERIFIED_FETCH_BLOCKED_2026-10-19
    local_path: data/raw/GC_ivtff_0d.txt
    redistribution: do_not_commit_by_default
    note: different glyph alphabet; Gate v2 compares aligned loci and documents glyph-interpretation differences explicitly.

reference_corpora:
  note: >-
    Used for local analysis only (E012, E019-E021). Prepared texts are regenerated by the
    experiments' run.py into the git-ignored runs/ directory and are never committed; licences
    were not independently verified from this environment, so nothing is redistributed.
    Corpus selection: experiments/E012_reference_signature/PLAN.md.
  copiale:
    source: matthewdgreen/cipher_benchmark benchmark/sources/copiale (pin in external/repos.yml); rights_class open per benchmark
    citation: Knight, Megyesi, Schaefer (2011), "The Copiale Cipher", ACL Workshop on Building and Using Comparable Corpora (W11-1202); transcription and plaintext by the authors
    redistribution: never_commit
  gutenberg_samples:
    source: matthewdgreen/cipher_benchmark synthetic plaintext samples (Project Gutenberg works, ASCII-normalised, benchmark seed 42)
    basis: public-domain texts per benchmark metadata; Project Gutenberg licence covers its trademark and header only
    redistribution: never_commit
  borg:
    source: matthewdgreen/cipher_benchmark benchmark/sources/borg; rights_class linked_only (image layer, Vatican IIIF); text layers Stockholm University research (no stated licence)
    status: NOT APPROVED for analysis; inventory only (E012 PLAN_DRAFT v2, no signature metric computed)
    redistribution: never_commit
